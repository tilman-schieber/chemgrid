<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemgrid</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fbe7a1'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='none' stroke='%231b1f24' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='17' text-anchor='middle' fill='%231b1f24'%3ECg%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <span class="logo" aria-hidden="true"><i>?</i><b>Cg</b></span>
      <h1>Chemgrid</h1>
      <div class="status">
        <span id="guesses"></span>
        <span id="score"></span>
      </div>
      <button id="help-open" class="icon" aria-label="How criteria are counted">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
          <path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.4-2.8 4.1"/>
          <path d="M12 17.6v.1"/>
        </svg>
      </button>
    </header>

    <nav class="days" aria-label="Day">
      <button id="prev-day" aria-label="Previous day">←</button>
      <span id="day"></span>
      <button id="next-day" aria-label="Next day">→</button>
      <button id="to-today" class="today">Today</button>
    </nav>

    <div id="board" class="board"></div>

    <ul class="legend" aria-label="Tile colours by element family">
      <li class="family-alkali">Alkali metal</li>
      <li class="family-alkaline">Alkaline earth</li>
      <li class="family-transition">Transition metal</li>
      <li class="family-post">Post-transition</li>
      <li class="family-metalloid">Metalloid</li>
      <li class="family-nonmetal">Nonmetal</li>
      <li class="family-noble">Noble gas</li>
      <li class="family-lanthanide">Lanthanide</li>
      <li class="family-actinide">Actinide</li>
      <li class="family-unknown">Unknown</li>
    </ul>

    <div class="table-wrap">
      <div id="table" class="table" aria-label="Periodic table: tap an element to guess it"></div>
    </div>

    <div id="entry" class="entry">
      <input id="guess" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Pick a cell, then type an element or symbol">
      <ul id="suggestions" class="suggestions"></ul>
    </div>

    <p id="message" class="message"></p>

    <div class="actions">
      <button id="give-up">Give up</button>
      <button id="share">Share result</button>
    </div>

    <section id="answers" class="answers" hidden></section>
  </main>

  <dialog id="help" class="help" aria-labelledby="help-title">
    <div class="help-head">
      <h2 id="help-title">How criteria are counted</h2>
      <button id="help-close" class="icon" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <input id="help-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search criteria, e.g. noble, named, melts">
    <p id="help-intro" class="help-intro"></p>
    <div id="help-list" class="help-list"></div>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
